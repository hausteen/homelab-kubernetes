  path: manifests/openbao/preinstall1/overlays/lab
...
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-preinstall2
  namespace: flux-system
spec:
  dependsOn:
  - name: openbao-preinstall1
    namespace: flux-system
  - name: cloudnativepg-install
    namespace: flux-system
  - name: longhorn-install
    namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  timeout: 10m
  prune: true
  wait: false # flux doesn't know how to monitor a cnpg cluster correctly by default. solution is to use a manual health check and expression
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: openbao-db
    namespace: openbao
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.reason == 'ClusterIsReady')
  path: manifests/openbao/preinstall2/overlays/lab
...
