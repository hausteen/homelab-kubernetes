kind: Kustomization
metadata:
  name: openbao-preinstall1
  namespace: flux-system
spec:
  dependsOn:
  - name: certmanager-postinstall1
    namespace: flux-system
  - name: externalsecretsoperator-install
    namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
