apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-server
  namespace: authentik
spec:
  secretName: authentik-server-certificate
  issuerRef:
    name: hunt-internal
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  isCA: false
  subject:
    countries:
    - usa
    organizations:
    - hunt
  dnsNames:
  - authentik-server
  - authentik-server.authentik
  - authentik-server.authentik.svc
  - authentik-server.authentik.svc.cluster.local
  commonName: app # the db verifies this field
  duration: 720h # 30 days * 24 hours
  renewBefore: 120h # 5 days before it ends. 5 days * 24 hours
