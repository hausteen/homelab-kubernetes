apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-server-secretkey-creation
  namespace: authentik
spec:
  template:
    spec:
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - "/bin/sh"
        args:
        - "-c"
        - "kubectl create secret generic authentik-server-secretkey --from-literal=secret-key=\"$(openssl rand 60 | base64 -w 0)\""
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
# goal: authentik needs a random encryption key, which is simply a long random string.
# method: 'openssl rand 60' gives us the random bytes, which we base64 encode, which results in a string.
# when the kubernetes secret is created, our base64 string is base64 encoded again.
# when the pod consumes the secret, the secret is decoded once, giving the pod our base64 encoded string.
