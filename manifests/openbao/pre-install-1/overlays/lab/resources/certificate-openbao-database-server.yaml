apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-database-server
  namespace: openbao
spec:
  secretName: openbao-database-server-certificate
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  issuerRef:
    name: hunt-internal
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  isCA: false
  subject:
    countries:
    - usa
    organizations:
    - hunt
  dnsNames:
  - openbao-db-rw
  - openbao-db-rw.openbao
  - openbao-db-rw.openbao.svc
  - openbao-db-rw.openbao.svc.cluster.local
  - openbao-db-r
  - openbao-db-r.openbao
  - openbao-db-r.openbao.svc
  - openbao-db-r.openbao.svc.cluster.local
  - openbao-db-ro
  - openbao-db-ro.openbao
  - openbao-db-ro.openbao.svc
  - openbao-db-ro.openbao.svc.cluster.local
  usages:
  - server auth
  duration: 720h # 30 days * 24 hours
  renewBefore: 120h # 5 days before it ends. 5 days * 24 hours
