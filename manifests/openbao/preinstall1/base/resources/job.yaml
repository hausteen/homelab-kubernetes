apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-server-unsealkey-creation
  namespace: openbao
spec:
  template:
    spec:
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - "/bin/sh"
        args:
        - "-c"
        - > # this takes the following lines and merges them together as a single line. this makes it readable. do NOT wrap it in ""
          kubectl create secret generic openbao-server-unsealkey-previous --from-literal=previous-unseal.key=\"$(openssl rand 32 | base64 -w 0)\"
          &&
          kubectl create secret generic openbao-server-unsealkey-current --from-literal=current-unseal.key=\"$(openssl rand 32 | base64 -w 0)\"
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
# goal: openbao needs 2 random encryption keys, where each is simply a long random string.
# method: 'openssl rand 32' gives us the random bytes, which we base64 encode, which results in a string.
# when the kubernetes secret is created, our base64 string is base64 encoded again.
# when the pod consumes the secret, the secret is decoded once, giving the pod our base64 encoded string.
