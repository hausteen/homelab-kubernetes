apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: opentelemetry
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: opentelemetry-operator
  targetNamespace: opentelemetry
  chartRef:
    kind: HelmChart
    name: opentelemetry-operator
    namespace: opentelemetry
  values:
    manager:
      collectorImage:
        repository: otel/opentelemetry-collector-k8s
      createRbacPermissions: false # i'm managing these myself
    admissionWebhooks:
      certManager:
        issuerRef:
          kind: ClusterIssuer
          name: huntinternal

# https://github.com/open-telemetry/opentelemetry-helm-charts
# https://opentelemetry.io/docs/platforms/kubernetes/helm/collector/
# https://opentelemetry.io/docs/platforms/kubernetes/collector/components/
# https://opentelemetry.io/docs/collector/components/
