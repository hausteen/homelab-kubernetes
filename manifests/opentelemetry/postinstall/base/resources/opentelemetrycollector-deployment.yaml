apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry-collector-deployment
  namespace: opentelemetry
spec:
  mode: deployment
  replicas: 1
  serviceAccount: opentelemetry-collector
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: K8S_NODE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: "1"
      memory: 1Gi
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 15
      k8s_attributes:
        auth_type: serviceAccount
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
          - k8s.deployment.name
          - k8s.node.name
          - k8s.container.name
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      delta_to_cumulative: # victoriametrics needs this
        max_stale: 5m
    exporters:
      debug: {}
      otlp_http/victorialogs:
        logs_endpoint: http://victorialogs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        compression: gzip
        tls:
          insecure: true
      otlp_http/victoriametrics:
        metrics_endpoint: http://victoriametrics-victoria-metrics-single-server.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
        compression: gzip
        encoding: proto
        tls:
          insecure: true
      otlp_http/victoriatraces:
        traces_endpoint: http://victoriatraces-vt-single-server.observability.svc.cluster.local:10428/insert/opentelemetry/v1/traces
        compression: gzip
        tls:
          insecure: true
    service: # this is what really instantiates the collector. the above defines all the items; we link them together down here.
      telemetry:
        logs:
          level: info
      extensions:
      - health_check
      pipelines:
        logs:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - k8s_attributes
          - batch
          exporters:
          - otlp_http/victorialogs
          # - debug
        metrics:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - k8s_attributes
          - delta_to_cumulative
          - batch
          exporters:
          - otlp_http/victoriametrics
          # - debug
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - k8s_attributes
          - batch
          exporters:
          - otlp_http/victoriatraces
          # - debug

# https://github.com/open-telemetry/opentelemetry-helm-charts
# https://opentelemetry.io/docs/platforms/kubernetes/helm/collector/
# https://opentelemetry.io/docs/platforms/kubernetes/collector/components/
# https://opentelemetry.io/docs/collector/components/
