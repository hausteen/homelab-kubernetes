apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali-operator
  namespace: kiali-operator
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: kiali-operator
  targetNamespace: kiali-operator
  chartRef:
    kind: HelmChart
    name: kiali-operator
    namespace: kiali-operator
  values:
    watchNamespace: kiali-operator
    onlyViewOnlyMode: false # true
