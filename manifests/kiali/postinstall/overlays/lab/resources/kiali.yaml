apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: kiali-operator
spec:
  auth:
    strategy: anonymous
  deployment:
    view_only_mode: false # true
  external_services:
    grafana:
      enabled: false
    prometheus:
      enabled: true
      url: http://victoriametrics-victoria-metrics-single-server.observability.svc.cluster.local:8428
# https://kiali.io/docs/configuration/kialis.kiali.io/
