apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginxgatewayfabric
  namespace: nginx-gateway-fabric
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: nginxgatewayfabric
  targetNamespace: nginx-gateway-fabric
  chartRef:
    kind: OCIRepository
    name: nginxgatewayfabric
    namespace: nginx-gateway-fabric
  values:
    nginxGateway: # ngf control plane configuration. these are global settings here.
      gatewayClassName: ngf # nginx gateway fabric only supports 1 gateway class as of 13 may 2026 and the default one is called 'nginx'. the chart creates it for us. i've renamed it to ngf.
      replicas: 2
      gwAPIExperimentalFeatures:
        enable: false
      config:
        logging:
          level: info
      productTelemetry:
        enable: false
      affinity:
        podAntiAffinity:
          # setting to preferred instead of required so that scaling during updates can work correctly.
          # i only have 3 worker nodes, which means i can't have more than 3 pods total if i go the required route.
          # during an update, i may have more than 3 pods. going the preferred route solves this problem by loadbalancing as best as possible.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchExpressions:
                - key: "app.kubernetes.io/name"
                  operator: In
                  values:
                  - nginx-gateway-fabric
    nginx: # ngf data plane configuration. these are global settings here. they apply to all gateways managed by the default gateway class
      debug: false
      replicas: 3
      ipFamily: ipv4
      useClusterIP: true # send traffic to the upstream service instead of directly to the upstream service's pods
      service:
        externalTrafficPolicy: Cluster # routes traffic to any of the service's pods. you want this when you don't have a pod on every node where the traffic comes into the cluster.
      config:
        logging:
          agentLevel: info
          errorLevel: info
      pod:
        affinity:
          podAntiAffinity:
            # setting to preferred instead of required so that scaling during updates can work correctly.
            # i only have 3 worker nodes, which means i can't have more than 3 pods total if i go the required route.
            # during an update, i may have more than 3 pods. going the preferred route solves this problem by loadbalancing as best as possible.
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: "kubernetes.io/hostname"
                labelSelector:
                  matchExpressions:
                  - key: "app.kubernetes.io/name"
                    operator: In
                    values:
                    - nginx-gateway-fabric
      # rewriteClientIP: # only enable this when ngf is behind another proxy or load balancer.
      #   mode: XForwardedFor
      #   setIPRecursively: true
      #   trustedAddresses:
      #   - type: CIDR
      #     value: "0.0.0.0/0"
