apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-corefile
  namespace: coredns
data: # the capital C is intentional
  Corefile: |
    testing.hunt.internal {
      file /etc/coredns/zone/testing.hunt.internal {
        reload 60s
        reload_by_mtime
      }
      errors
      loadbalance
      log
      loop
      ready
      reload
      health {
        lameduck 5s
      }
    }
