apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-corefile
  namespace: coredns
data: # the capital C is intentional
  Corefile: |
    lab.hunt.internal:53 {
      errors
      forward . 192.168.30.3
      log
    }
    testing.hunt.internal:53 {
      errors
      forward . 192.168.30.4
      log
    }
    home.hunt.internal:53 {
      auto {
        directory /etc/coredns/ (.*hunt\.internal) {1}
        reload 60s
      }
      errors
      health :8080 {
        lameduck 5s
      }
      loadbalance
      log
      loop
      ready :8081
      reload
    }
    .:53 {
      cache 300
      errors
      forward . https://1.1.1.1 https://1.0.0.1 {
        tls_servername cloudflare-dns.com
      }
      loadbalance
      log
    }
