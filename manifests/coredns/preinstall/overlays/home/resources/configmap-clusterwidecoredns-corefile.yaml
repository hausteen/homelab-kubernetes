# this is going to modify the cluster wide default coredns install intentionally.
# i want the whole cluster to know how to resolve the custom domain i have.
# the filename is intentional as well.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data: # the capital C is intentional
  Corefile: |
    home.hunt.internal {
      forward . 192.168.30.2
      errors
      loadbalance
      log
      loop
      ready
      reload
    }
    . {
      health {
        lameduck 5s
      }
      kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
      }
      forward . /etc/resolv.conf {
        max_concurrent 1000
      }
      cache 30 {
        disable success cluster.local
        disable denial cluster.local
      }
      errors
      loadbalance
      log
      loop
      ready
      reload
      prometheus :9153
    }
