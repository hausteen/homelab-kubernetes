apiVersion: batch/v1
kind: Job
metadata:
  name: huntinternal-certificateauthority-previous-creation
  namespace: cert-manager
spec:
  template:
    spec:
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - "/bin/sh"
        args:
        - "-c"
        - "kubectl create configmap huntinternal-certificateauthority-previous --from-literal=ca.crt=\"$(kubectl get secrets huntinternal-certificateauthority -o jsonpath=\"{.data.ca\\.crt}\" | base64 -d)\""
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
