apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-single
  namespace: victoriametrics-restricted
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: vms
  targetNamespace: victoriametrics-restricted
  chartRef:
    kind: HelmChart
    name: victoria-metrics-single
    namespace: victoriametrics-restricted
  values:
    nameOverride: vms
    server:
      persistentVolume:
        storageClassName: withoutreplication
        size: 10Gi
      retentionPeriod: 1M # lowercase m means minutes (not allowed). uppercase M means months (is allowed).
      extraArgs:
        maxLabelsPerTimeseries: "60" # string. needed for istio higher count of labels
      podSecurityContext:
        enabled: true
        fsGroup: 65534
      securityContext:
        enabled: true
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
          - ALL
