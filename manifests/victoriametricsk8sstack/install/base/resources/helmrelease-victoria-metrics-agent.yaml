apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-agent
  namespace: victoriametrics-restricted
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: vma
  targetNamespace: victoriametrics-restricted
  chartRef:
    kind: HelmChart
    name: victoria-metrics-agent
    namespace: victoriametrics-restricted
  values:
    nameOverride: vma
    remoteWrite:
    - url: http://vms-server.victoriametrics-restricted.svc.cluster.local:8428/api/v1/write
    persistentVolume:
      enabled: true
      storageClassName: withoutreplication
      size: 1Gi
    mode: deployment
    deployment:
      spec:
        strategy:
          type: Recreate # prevents file lock issue on the persistent volume. no rolling update
    # replicaCount: 1
    extraArgs:
      promscrape.maxScrapeSize: 32MB # needed for k8s api server metrics size
    podSecurityContext:
      enabled: true
      fsGroup: 65534
    securityContext:
      enabled: true
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
