apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
  namespace: observability-privileged
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: vla # named for victoria logs agent. the collector chart deploys the agent as a daemonset.
  targetNamespace: observability-privileged
  chartRef:
    kind: HelmChart
    name: victoria-logs-collector
    namespace: observability-restricted # the chart lives here since this is where the helm repo is
  values:
    nameOverride: vla # named for victoria logs agent. the collector chart deploys the agent as a daemonset.
    remoteWrite:
    - url: http://vls-server.observability-restricted.svc.cluster.local:9428
      maxDiskUsagePerURL: 1GB
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    collector:
      includePodLabels: true              # default: true
      includePodAnnotations: false        # default: false
      includeNodeLabels: false            # default: false
      includeNodeAnnotations: false       # default: false
      includeNamespaceLabels: false       # default: false
      includeNamespaceAnnotations: false  # default: false
      # Note that vlagent does not update Node, Pod, and Namespace metadata during runtime.
      # If Node, Pod, or Namespace labels change, you must restart vlagent to apply those changes.
