apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-single
  namespace: observability-restricted
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: vls
  targetNamespace: observability-restricted
  chartRef:
    kind: HelmChart
    name: victoria-logs-single
    namespace: observability-restricted
  values:
    nameOverride: vls
    server:
      persistentVolume:
        storageClassName: withoutreplication
        size: 10Gi
      retentionPeriod: 180d
      retentionMaxDiskUsagePercent: "90" # string
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
          - ALL
