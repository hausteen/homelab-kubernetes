apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-traces-agent
  namespace: observability-restricted
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: vta
  targetNamespace: observability-restricted
  chartRef:
    kind: HelmChart
    name: victoria-traces-agent
    namespace: observability-restricted
  values:
    nameOverride: vta
    remoteWrite:
    - url: http://vts-server.observability-restricted.svc.cluster.local:10428
    persistentVolume:
      enabled: true
      storageClassName: withoutreplication
      size: 1Gi
    podSecurityContext:
      enabled: true
      fsGroup: 65534
    securityContext:
      enabled: true
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
