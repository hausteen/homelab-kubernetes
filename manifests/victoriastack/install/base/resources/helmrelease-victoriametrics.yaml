apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: observability
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: victoriametrics
  targetNamespace: observability
  chartRef:
    kind: HelmChart
    name: victoriametrics
    namespace: observability
  values:
    server:
      persistentVolume:
        storageClassName: "withoutreplication"
        size: 10Gi
      retentionPeriod: 1y
      retentionMaxDiskUsagePercent: 90
      podSecurityContext:
        enabled: true
        fsGroup: 65534
      securityContext:
        enabled: true
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
          - ALL
