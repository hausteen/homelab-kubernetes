apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 15m
  timeout: 5m
  install:
    crds: Create
    createNamespace: false
    serverSideApply: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: Create
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  releaseName: headlamp
  targetNamespace: headlamp
  chartRef:
    kind: HelmChart
    name: headlamp
    namespace: headlamp
  values: # https://github.com/kubernetes-sigs/headlamp/tree/main/charts/headlamp
    podSecurityContext:
      fsGroup: 2000
    securityContext:
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    service:
      appProtocol: https
      port: 443
    env:
    - name: HEADLAMP_CONFIG_LOG_LEVEL
      value: info
    probes:
      scheme: HTTPS # 'HTTPS' required when tls is enabled
    clusterRoleBinding:
      create: true # set this to false when ready to use oidc and my own clusterrole and binding
    config:
      inCluster: true
      inClusterContextName: lab
      tlsCertPath: "/secrets/tls.crt"
      tlsKeyPath: "/secrets/tls.key"
      # oidc:
      #   secret:
      #     create: false
      #     name: headlamp-oidc
      watchPlugins: true
      pluginsDir: "/headlamp/plugins"
      staticPlugins:
        enabled: true
      extraArgs:
      - -user-plugins-dir=/headlamp/static-plugins
    pluginsManager:
      enabled: true
      # configFile: "plugin.yml"
      # https://artifacthub.io/packages/search?repo=headlamp-plugins
      # https://artifacthub.io/packages/search?kind=21
      configContent: |
        plugins:
        - name: flux
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
          version: 0.7.0
        - name: cert-manager
          source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
          version: 0.1.1
        - name: trivy
          source: https://artifacthub.io/packages/headlamp/headlamp-trivy/headlamp_trivy
          version: 0.3.2
        # - name: kubescape
        #   source: https://artifacthub.io/packages/headlamp/kubescape-headlamp-plugin/headlamp_kubescape
        #   version: 0.11.2
        # - name: kyverno
        #   source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_kyverno
        #   version: 0.1.0
    volumeMounts:
    - name: home-folder-config
      mountPath: /home/headlamp/.config # the container wants to write to this folder for some reason
    - name: headlamp-server-tls
      mountPath: /secrets
    - name: tmp
      mountPath: /tmp
    volumes:
    - name: home-folder-config
      emptyDir: {}
    - name: headlamp-server-tls
      secret:
        secretName: headlamp-server-tls
    - name: tmp
      emptyDir: {}
