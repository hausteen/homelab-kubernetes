apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-server-tls
  namespace: headlamp
spec:
  secretName: headlamp-server-tls
  issuerRef:
    name: huntinternal
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  isCA: false
  subject:
    countries:
    - usa
    organizations:
    - hunt
  dnsNames:
  - headlamp
  - headlamp.headlamp
  - headlamp.headlamp.svc
  - headlamp.headlamp.svc.cluster.local
  duration: 720h # 30 days * 24 hours
  renewBefore: 120h # 5 days before it ends. 5 days * 24 hours
