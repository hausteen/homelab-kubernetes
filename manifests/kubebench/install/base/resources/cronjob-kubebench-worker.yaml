apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubebench-worker
  namespace: kube-bench
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  jobtemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          hostPID: true
          restartPolicy: Never
          containers:
          - name: kube-bench
            image: aquasec/kube-bench:latest
            command:
            - kube-bench
            - run
            - --targets
            - node
            - --benchmark
            - cis-1.10
            - --skip
            - "4.1.1,4.1.5,4.1.6,4.1.9,4.1.10,4.2.1,4.2.2,4.2.3"
